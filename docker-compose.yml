services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codebase-ai-postgres
    environment:
      POSTGRES_DB: codebase_ai
      POSTGRES_USER: codebase
      POSTGRES_PASSWORD: codebase
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: codebase-ai-backend
    env_file:
      - ./backend/.env
    volumes:
      - .:/workspace/repository:ro
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  pgdata: